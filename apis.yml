aid: slice-cards
name: Slice
description: >-
  Slice is an Indian consumer fintech and small finance bank, founded in
  2016 as SlicePay by Rajan Bajaj and headquartered between Bengaluru
  (corporate) and Guwahati (registered). The company originally built a
  buy-now-pay-later product and a prepaid-card-plus-credit-line offering
  aimed at students and young professionals — pitched as a credit-card
  alternative for India's Gen Z — and at its peak was reportedly issuing
  over 300,000 prepaid cards per month before RBI's 2022 restrictions on
  credit-linked PPI products forced a pivot. In October 2023 Slice
  announced a merger with the regulated North East Small Finance Bank
  (NESFB), the first fintech-into-bank merger in India; the merger
  received RBI approval in October 2023, CCI approval in March 2024 and
  NCLT (Guwahati) approval in August 2024, completed on October 27,
  2024, and the combined entity was rebranded as Slice Small Finance
  Bank in May 2025. Today Slice operates a consumer mobile-first
  neobank — savings accounts, fixed deposits, UPI, a Slice credit card
  and rewards — alongside a merchant-facing payments stack exposed
  through a Merchant API (api.nebank.com) covering bank-account
  validation, payouts, pay-in/collect, refunds, virtual accounts,
  balance, transactions and webhook notifications. As of late 2024 the
  company had raised approximately $387M from investors including Tiger
  Global, Insight Partners and Blume Ventures.
